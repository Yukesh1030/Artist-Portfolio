<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACKLY - Sign Up</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="custom-cursor"></div>

    <div class="auth-layout">
        <!-- Back to Home -->
        <a href="index.html" class="back-to-home" id="auth-back">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>

        <!-- Signup Card -->
        <div class="auth-container" id="auth-card">
            <h2 class="display-text">Create Account</h2>
            <p>Join the studio platform</p>

            <form class="auth-form" id="signupForm" novalidate>
                
                <div class="form-group">
                    <label>Sign Up As</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-user-tag" style="position: absolute; left: 15px; top: 15px; color: rgba(245, 241, 232, 0.5);"></i>
                        <select class="form-control" id="signupRole" style="padding-left: 45px;" required>
                            <option value="Client">Client</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-user" style="position: absolute; left: 15px; top: 15px; color: rgba(245, 241, 232, 0.5);"></i>
                        <input type="text" class="form-control" id="signupName" placeholder="John Doe" style="padding-left: 45px;" required>
                    </div>
                    <div class="form-error" id="signupNameError">Please enter your full name.</div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-envelope" style="position: absolute; left: 15px; top: 15px; color: rgba(245, 241, 232, 0.5);"></i>
                        <input type="email" class="form-control" id="signupEmail" placeholder="user@example.com" style="padding-left: 45px;" required>
                    </div>
                    <div class="form-error" id="signupEmailError">Please enter a valid email.</div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-lock" style="position: absolute; left: 15px; top: 15px; color: rgba(245, 241, 232, 0.5);"></i>
                        <input type="password" class="form-control" id="signupPassword" placeholder="••••••••" style="padding-left: 45px;" required>
                        <i class="fa-solid fa-eye" id="toggleSignupPassword" style="position: absolute; right: 15px; top: 15px; color: rgba(245, 241, 232, 0.5); cursor: pointer;"></i>
                    </div>
                    <div class="form-error" id="signupPasswordError">Password must be at least 6 characters.</div>
                </div>

                <button type="submit" class="btn btn-solid" style="width: 100%; margin-top: 10px; border-radius: 8px;">Sign Up</button>

                <div class="auth-links text-center">
                    Already have an account? <a href="Login.html" style="font-weight: 600;">Login</a>
                </div>
            </form>
        </div>
    </div>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
