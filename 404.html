<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACKLY - 404</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
        }
        
        .error-container {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }

        .error-code {
            font-family: var(--font-display);
            font-size: 15rem;
            line-height: 1;
            color: var(--text-color);
            position: relative;
            margin: 0;
            opacity: 0;
        }

        .error-text {
            font-size: 1.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 40px;
            opacity: 0;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            opacity: 0;
        }

        /* Abstract Waveform Background */
        .abstract-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw;
            height: 150vh;
            z-index: 1;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.1;
        }

        .circle {
            position: absolute;
            border: 1px solid var(--accent-color);
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .error-code { font-size: 8rem; }
            .error-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="custom-cursor"></div>

    <div class="abstract-wave" id="wave-bg">
        <!-- Circles generated by JS -->
    </div>

    <div class="error-container">
        <div class="glitch-wrapper">
            <h1 class="error-code" id="code">404</h1>
        </div>
        <p class="error-text" id="text">Silence. Nothing Found.</p>
        
        <div class="btn-group" id="buttons">
            <button onclick="history.back()" class="btn"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
            <a href="index.html" class="btn btn-solid"><i class="fa-solid fa-house"></i> Back to Home</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Generate circles
            const waveBg = document.getElementById('wave-bg');
            for(let i = 1; i <= 10; i++) {
                const circle = document.createElement('div');
                circle.classList.add('circle');
                circle.style.width = `${i * 10}vw`;
                circle.style.height = `${i * 10}vw`;
                waveBg.appendChild(circle);
            }

            const tl = gsap.timeline();

            // Background pulse
            gsap.to('.circle', {
                scale: 1.2,
                opacity: 0,
                duration: 2,
                stagger: 0.2,
                repeat: -1,
                ease: "power1.out"
            });

            // Text reveal
            tl.to("#code", {
                opacity: 1,
                y: 0,
                duration: 1,
                ease: "bounce.out"
            })
            .to("#text", {
                opacity: 1,
                y: -20,
                duration: 0.5,
                ease: "power2.out"
            }, "-=0.5")
            .to("#buttons", {
                opacity: 1,
                y: -10,
                duration: 0.5,
                ease: "power2.out"
            }, "-=0.3");

            // Custom cursor logic specific to this page without main.js
            const cursor = document.querySelector(".custom-cursor");
            document.addEventListener("mousemove", (e) => {
                cursor.style.left = e.clientX + "px";
                cursor.style.top = e.clientY + "px";
            });

            const interactiveElements = document.querySelectorAll("a, button");
            interactiveElements.forEach(el => {
                el.addEventListener("mouseenter", () => cursor.classList.add("hover"));
                el.addEventListener("mouseleave", () => cursor.classList.remove("hover"));
            });
        });
    </script>
</body>
</html>
