<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACKLY - Client Dashboard</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: rgba(10, 10, 10, 0.95);
            border-right: 1px solid rgba(245, 241, 232, 0.1);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
        }
        .sidebar-brand { margin-bottom: 50px; text-align: center; }
        .sidebar-brand img { height: 40px; }
        .sidebar-menu { list-style: none; flex-grow: 1; }
        .sidebar-menu li { margin-bottom: 15px; }
        .sidebar-menu a {
            display: flex; align-items: center; gap: 15px;
            padding: 12px 20px; border-radius: 8px;
            color: rgba(245, 241, 232, 0.7); transition: all 0.3s ease;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: rgba(201, 163, 93, 0.1); color: var(--accent-color);
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; border-bottom: 1px solid rgba(245, 241, 232, 0.1); padding-bottom: 20px;
        }
        .topbar h2 { font-family: var(--font-display); font-size: 2.5rem; }
        
        /* Dashboard Stats */
        .stats-cards {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(245, 241, 232, 0.02); border: 1px solid rgba(245, 241, 232, 0.05);
            padding: 30px; border-radius: 12px;
        }
        .stat-card h4 { color: rgba(245, 241, 232, 0.5); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 15px; }
        .stat-card .value { font-size: 1.5rem; color: var(--accent-color); font-family: var(--font-body); }

        /* Dynamic Projects Section */
        .project-section {
            background: rgba(245, 241, 232, 0.02);
            border: 1px solid rgba(245, 241, 232, 0.05);
            border-radius: 12px;
            padding: 30px;
        }
        .project-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .project-list {
            display: flex; flex-direction: column; gap: 15px;
        }
        .project-item {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;
            padding: 15px; background: rgba(10, 10, 10, 0.5);
            border: 1px solid rgba(245, 241, 232, 0.05);
            border-radius: 8px; align-items: center;
            transition: border-color 0.3s;
        }
        .project-item:hover { border-color: var(--accent-color); }
        .project-name { font-weight: 600; color: var(--text-color); }
        .project-status { color: var(--accent-color); font-size: 0.9rem; }
        .project-action { text-align: right; }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(245, 241, 232, 0.1); padding: 20px; flex-direction: row; align-items: center; justify-content: space-between; }
            .sidebar-brand { margin-bottom: 0; }
            .sidebar-menu { display: none; }
            .stats-cards { grid-template-columns: 1fr; }
            .project-item { grid-template-columns: 1fr; gap: 10px; }
            .project-action { text-align: left; }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="custom-cursor"></div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="Assets/Brand-logo.webp" alt="Stackly Logo">
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="fa-solid fa-layer-group"></i> My Projects</a></li>
            <li><a href="#"><i class="fa-solid fa-file-invoice"></i> Invoices</a></li>
            <li><a href="#"><i class="fa-solid fa-comment-dots"></i> Communication</a></li>
            <li><a href="#"><i class="fa-solid fa-folder-open"></i> Files & Assets</a></li>
        </ul>
        <a href="index.html" class="btn" style="text-align: center;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <h2>Client Portal</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <i class="fa-solid fa-user-circle" style="font-size: 2rem; color: var(--accent-color);"></i>
                <span>Welcome, Client</span>
            </div>
        </div>

        <div class="stats-cards">
            <div class="stat-card">
                <h4>Active Project</h4>
                <div class="value" style="font-size: 1.5rem;">Neon Nights (Album)</div>
            </div>
            <div class="stat-card">
                <h4>Status</h4>
                <div class="value" style="font-size: 1.5rem;">In Production</div>
            </div>
            <div class="stat-card">
                <h4>Next Milestone</h4>
                <div class="value" style="font-size: 1.5rem;">Oct 15, 2026</div>
            </div>
        </div>

        <div class="project-section">
            <div class="project-header">
                <h3>Project Deliverables (Dynamic)</h3>
                <button class="btn btn-solid" style="padding: 8px 16px; font-size: 0.8rem;" id="refreshDeliverables"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
            </div>
            <div class="project-list" id="deliverablesContainer">
                <!-- Items injected via JS -->
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cursor = document.querySelector(".custom-cursor");
            if (cursor) {
                document.addEventListener("mousemove", (e) => {
                    cursor.style.left = e.clientX + "px";
                    cursor.style.top = e.clientY + "px";
                });
            }

            // Dynamic Deliverables
            const deliverables = [
                { name: "Track 1: Intro (V2 Mix)", status: "Ready for Review" },
                { name: "Track 2: Midnight (V1 Mix)", status: "In Progress" },
                { name: "Track 3: Void (Final Master)", status: "Approved" }
            ];

            const deliverablesContainer = document.getElementById('deliverablesContainer');
            
            function renderDeliverables() {
                deliverablesContainer.innerHTML = '';
                deliverables.forEach((item, i) => {
                    const el = document.createElement('div');
                    el.classList.add('project-item');
                    el.innerHTML = `
                        <div class="project-name">${item.name}</div>
                        <div class="project-status">${item.status}</div>
                        <div class="project-action"><button class="btn" style="padding: 5px 15px; font-size: 0.8rem;">View</button></div>
                    `;
                    deliverablesContainer.appendChild(el);

                    // Animate Entrance
                    gsap.from(el, {
                        opacity: 0,
                        x: -20,
                        duration: 0.5,
                        delay: i * 0.1
                    });
                });
            }

            renderDeliverables();

            document.getElementById('refreshDeliverables').addEventListener('click', () => {
                // Simulate fetch
                deliverables[1].status = "Ready for Review";
                renderDeliverables();
            });
            
            // Layout entrance
            gsap.from(".stat-card", {
                opacity: 0,
                y: 20,
                duration: 0.6,
                stagger: 0.1
            });
        });
    </script>
</body>
</html>
