<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACKLY - Login</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="custom-cursor"></div>

    <div class="auth-layout">
        <!-- Back to Home -->
        <a href="index.html" class="back-to-home" id="auth-back">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>

        <!-- Login Card -->
        <div class="auth-container" id="auth-card">
            <!-- Brand Logo -->
            <a href="index.html" style="display: inline-block; margin-bottom: 20px;">
                <img src="Assets/Brand-logo.webp" alt="Stackly Logo" style="height: 40px; filter: brightness(0) saturate(100%) invert(61%) sepia(84%) saturate(241%) hue-rotate(0deg) brightness(93%) contrast(90%);">
            </a>
            <h2 class="display-text">Welcome Back</h2>
            <p>Sign in to your account</p>

            <form class="auth-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label>Login As</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-user" style="position: absolute; left: 15px; top: 15px; color: rgba(245, 241, 232, 0.5);"></i>
                        <select class="form-control" id="loginRole" style="padding-left: 45px;" required>
                            <option value="Client">Client</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-envelope" style="position: absolute; left: 15px; top: 15px; color: rgba(245, 241, 232, 0.5);"></i>
                        <input type="email" class="form-control" id="loginEmail" placeholder="user@example.com" style="padding-left: 45px;" required>
                    </div>
                    <div class="form-error" id="loginEmailError">Please enter a valid email.</div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label>Password</label>
                        <a href="404.html" style="font-size: 0.8rem; color: var(--accent-color);">Forgot password?</a>
                    </div>
                    <div style="position: relative;">
                        <i class="fa-solid fa-lock" style="position: absolute; left: 15px; top: 15px; color: rgba(245, 241, 232, 0.5);"></i>
                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" style="padding-left: 45px;" required>
                        <i class="fa-solid fa-eye" id="togglePassword" style="position: absolute; right: 15px; top: 15px; color: rgba(245, 241, 232, 0.5); cursor: pointer;"></i>
                    </div>
                    <div class="form-error" id="loginPasswordError">Password is required.</div>
                </div>

                <button type="submit" class="btn btn-solid" style="width: 100%; margin-top: 10px; border-radius: 8px;">Login</button>

                <div class="auth-links text-center">
                    Don't have an account? <a href="Signup.html" style="font-weight: 600;">Create an account</a>
                </div>
            </form>
        </div>
    </div>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
