<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACKLY - Admin Dashboard</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: rgba(10, 10, 10, 0.95);
            border-right: 1px solid rgba(245, 241, 232, 0.1);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
        }
        .sidebar-brand { margin-bottom: 50px; text-align: center; }
        .sidebar-brand img { height: 40px; }
        .sidebar-menu { list-style: none; flex-grow: 1; }
        .sidebar-menu li { margin-bottom: 15px; }
        .sidebar-menu a {
            display: flex; align-items: center; gap: 15px;
            padding: 12px 20px; border-radius: 8px;
            color: rgba(245, 241, 232, 0.7); transition: all 0.3s ease;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: rgba(201, 163, 93, 0.1); color: var(--accent-color);
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; border-bottom: 1px solid rgba(245, 241, 232, 0.1); padding-bottom: 20px;
        }
        .topbar h2 { font-family: var(--font-display); font-size: 2.5rem; }
        
        /* Dashboard Stats */
        .stats-cards {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(245, 241, 232, 0.02); border: 1px solid rgba(245, 241, 232, 0.05);
            padding: 30px; border-radius: 12px;
        }
        .stat-card h4 { color: rgba(245, 241, 232, 0.5); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 15px; }
        .stat-card .value { font-size: 2.5rem; color: var(--accent-color); font-family: var(--font-display); }

        /* Dynamic Email Section */
        .email-section {
            background: rgba(245, 241, 232, 0.02);
            border: 1px solid rgba(245, 241, 232, 0.05);
            border-radius: 12px;
            padding: 30px;
        }
        .email-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .email-list {
            display: flex; flex-direction: column; gap: 15px;
        }
        .email-item {
            display: grid; grid-template-columns: 200px 1fr 100px; gap: 20px;
            padding: 15px; background: rgba(10, 10, 10, 0.5);
            border: 1px solid rgba(245, 241, 232, 0.05);
            border-radius: 8px; align-items: center;
            transition: border-color 0.3s;
        }
        .email-item:hover { border-color: var(--accent-color); }
        .email-sender { font-weight: 600; color: var(--text-color); }
        .email-subject { color: rgba(245, 241, 232, 0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .email-date { color: rgba(245, 241, 232, 0.5); font-size: 0.8rem; text-align: right; }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(245, 241, 232, 0.1); padding: 20px; flex-direction: row; align-items: center; justify-content: space-between; }
            .sidebar-brand { margin-bottom: 0; }
            .sidebar-menu { display: none; } /* Simplified for mobile admin view */
            .stats-cards { grid-template-columns: 1fr; }
            .email-item { grid-template-columns: 1fr; gap: 5px; }
            .email-date { text-align: left; }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="custom-cursor"></div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="Assets/Brand-logo.webp" alt="Stackly Logo">
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
            <li><a href="#"><i class="fa-solid fa-music"></i> Projects</a></li>
            <li><a href="#"><i class="fa-solid fa-users"></i> Clients</a></li>
            <li><a href="#"><i class="fa-solid fa-envelope"></i> Messages</a></li>
            <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
        </ul>
        <a href="index.html" class="btn" style="text-align: center;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <h2>Admin Overview</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="Assets/Brand-logo.webp" alt="Admin" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--accent-color); object-fit: cover; background: white; padding: 5px;">
                <span>Stackly Admin</span>
            </div>
        </div>

        <div class="stats-cards">
            <div class="stat-card">
                <h4>Active Projects</h4>
                <div class="value">08</div>
            </div>
            <div class="stat-card">
                <h4>Pending Inquiries</h4>
                <div class="value">14</div>
            </div>
            <div class="stat-card">
                <h4>Total Clients</h4>
                <div class="value">42</div>
            </div>
        </div>

        <div class="email-section">
            <div class="email-header">
                <h3>Recent Inquiries (Dynamic)</h3>
                <button class="btn btn-solid" style="padding: 8px 16px; font-size: 0.8rem;" id="refreshEmails"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
            </div>
            <div class="email-list" id="emailContainer">
                <!-- Emails injected via JS -->
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cursor = document.querySelector(".custom-cursor");
            if (cursor) {
                document.addEventListener("mousemove", (e) => {
                    cursor.style.left = e.clientX + "px";
                    cursor.style.top = e.clientY + "px";
                });
            }

            // Dynamic Emails
            const emails = [
                { sender: "Director John", subject: "Film Score Inquiry: The Horizon", date: "10:30 AM" },
                { sender: "Vellichor Mgmt", subject: "Album Production Timeline", date: "Yesterday" },
                { sender: "Aura Films", subject: "Revisions for Scene 42", date: "Sep 07" },
                { sender: "Emma Watson", subject: "Collaboration request for upcoming indie", date: "Sep 05" }
            ];

            const emailContainer = document.getElementById('emailContainer');
            
            function renderEmails() {
                emailContainer.innerHTML = '';
                emails.forEach((email, i) => {
                    const el = document.createElement('div');
                    el.classList.add('email-item');
                    el.innerHTML = `
                        <div class="email-sender">${email.sender}</div>
                        <div class="email-subject">${email.subject}</div>
                        <div class="email-date">${email.date}</div>
                    `;
                    emailContainer.appendChild(el);

                    // Animate Entrance
                    gsap.from(el, {
                        opacity: 0,
                        x: -20,
                        duration: 0.5,
                        delay: i * 0.1
                    });
                });
            }

            renderEmails();

            document.getElementById('refreshEmails').addEventListener('click', () => {
                // Simulate fetching new data
                emails.unshift({ sender: "New Client", subject: "Project Proposal & Budget", date: "Just now" });
                if(emails.length > 5) emails.pop();
                renderEmails();
            });
            
            // Layout entrance
            gsap.from(".stat-card", {
                opacity: 0,
                y: 20,
                duration: 0.6,
                stagger: 0.1
            });
        });
    </script>
</body>
</html>
